spring.application.name=greenShare

#spring.datasource.driverClassName=org.mariadb.jdbc.Driver
#spring.datasource.url=jdbc:mariadb://localhost:3306/study_db
spring.datasource.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
spring.datasource.url=jdbc:log4jdbc:mariadb://localhost:3306/team4
spring.datasource.username=team4_user

spring.datasource.password=mariadb

#\uCFFC\uB9AC\uBB38\uC774 \uC788\uB294 mapper \uD30C\uC77C \uC704\uCE58 \uC9C0\uC815, classpath\uB294 resources \uD3F4\uB354\uB97C \uC758\uBBF8\uD568
mybatis.mapper-locations=classpath:mapper/*.xml
#DB\uC5D0\uC11C \uC5B8\uB354\uC2A4\uCF54\uC5B4\uB85C \uBA85\uBA85\uB41C \uCEEC\uB7FC\uBA85\uC744 \uBCC0\uACBD
mybatis.configuration.map-underscore-to-camel-case=true
#select \uCFFC\uB9AC \uACB0\uACFC\uB97C \uAC00\uC838\uC62C DTO \uD074\uB798\uC2A4 \uD30C\uC77C\uC774 \uC120\uC5B8\uB41C \uD328\uD0A4\uC9C0\uBA85 \uC9C0\uC815
mybatis.type-aliases-package=com.green.greenshare

# ===== \uC774\uBA54\uC77C \uC804\uC1A1\uC744 \uC704\uD55C \uC124\uC815 =====
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your_email@gmail.com
spring.mail.password=your_app_password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# \uC774\uBA54\uC77C \uB514\uBC84\uAE45 \uB85C\uADF8 (\uC120\uD0DD \uC0AC\uD56D)
spring.mail.properties.mail.debug=true


